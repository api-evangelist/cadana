                  currency: COP
                  paymentDetails:
                    preferredMethod: bank
                    bank:
                      accountName: John Doe
                      accountNumber: '123456789'
                      accountType: Checking
                      bankCode: EXMPCOBB
                      bankName: Colombia Bank
                      branchName: ''
                      beneficiaryId:
                        type: NIT
                        value: '123456789'
                      address:
                        line1: Avenida Caracas
                        line2: ''
                        city: Bogota
                        postalCode: ''
                        state: ''
                        countryCode: CO
                      email: john.doe@example.com
                  kyc:
                    firstName: John
                    lastName: Doe
                    dateOfBirth: '1985-12-20'
                    countryCode: CO
