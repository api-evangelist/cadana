                  idFileFront: 1d3f870c-bc91-4636-a0d4-8e54bccf7d64
                  idFileBack: ''
                createdTimestamp: 1748550207
                lastUpdatedTimestamp: 1748550207
    GetBeneficiariesResponse_2:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Beneficiary'
              node:
