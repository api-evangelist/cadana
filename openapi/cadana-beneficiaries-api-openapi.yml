          examples:
            colombia:
              summary: Single Colombia beneficiary
              value:
                data:
                - id: 30e06567-9fa9-48b0-bf67-c54eb49e8b03
                  tenantKey: cad65668351
                  businessId: 186ea4c2-b606-4f13-a2b3-5cca8564c17e
