          - forbidden
          - internal_error
        message:
          description: A human readable message describing the error
          type: string
  parameters:
    personId:
      name: personId
      in: path
      description: The unique identifier for the person
      required: true
      schema:
        type: string
        format: uuid
    XMultiTenantKey:
      name: X-MultiTenantKey
      in: header
      required: false
      schema:
        type: string
      description: Required when using a Platform API token. The tenant key identifying which business to operate on.
  responses:
    GetPersonResponse:
      description: get person response
      content:
        application/json:
          schema:
            description: Get person response
            allOf:
            - $ref: '#/components/schemas/CreatePersonRequest'
            - type: object
              properties:
                id:
                  $ref: '#/components/schemas/uuid'
                dateOfBirth:
                  type: string
                  format: date
                  nullable: true
                  description: Person's date of birth. Only present when set.
                  example: '1990-05-15'
                nationalId:
                  allOf:
                  - $ref: '#/components/schemas/NationalID'
                  nullable: true
                  description: National identification document. Only present when set.
                taxId:
                  allOf:
                  - $ref: '#/components/schemas/NationalID'
                  nullable: true
                  description: Tax identification document. Only present when set.
                socialSecurityId:
                  allOf:
                  - $ref: '#/components/schemas/NationalID'
                  nullable: true
                  description: Social security identification document. Only present when set.
                gender:
                  type: string
                  enum:
                  - male
                  - female
                  - other
                  nullable: true
                  description: Person's gender. Only present when set.
                  example: female
                nationality:
                  type: string
                  nullable: true
                  description: ISO 3166-1 alpha-2 country code. Only present when set.
                  example: DE
                offboardingDetails:
                  $ref: '#/components/schemas/OffboardingDetails'
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    CreatePersonResponse:
      description: create person response
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/uuid'
    GetPersonsResponse:
      description: get persons response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/personEntry'
              meta:
                $ref: '#/components/schemas/meta'
    GetPersonPaymentInfoResponse:
      description: get person payment info response
      content:
        application/json:
          schema:
            description: Get person payment info
            allOf:
            - $ref: '#/components/schemas/paymentMethods'
          examples:
            walletPaymentResponse:
              summary: Wallet Payment Response
              value:
                preferredMethod: wallet
                wallet:
                  identifier: 8ef9a712-cdae-4110-b1ea-9ba95abbee6e
                  type: USER
                  currency: USD
            bankPaymentResponse:
              summary: Bank Payment Response
              value:
                preferredMethod: bank
                bank:
                  accountName: John Doe
                  accountNumber: '123456789'
                  bankName: National Bank
                  bankCode: '001'
                  address:
                    line1: Main Street
                    line2: Suite 100
                    city: New York
                    postalCode: '10001'
                    state: NY
                    countryCode: US
    BadRequestError:
      description: Bad input provided by client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestError'
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      bearerFormat: API_SECRET_KEY
x-readme:
  explorer-enabled: true
  proxy-enabled: true
  samples-enabled: true
