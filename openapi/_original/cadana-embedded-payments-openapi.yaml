    coBankSchema:
      summary: Colombia - bank payment method schema
      value:
        $schema: http://json-schema.org/draft-07/schema#
        $id: https://api.cadana.com/schemas/paymentDetails.bank.CO.json
        title: Colombia - bank payment details
        type: object
        additionalProperties: false
        required:
          - accountName
          - accountNumber
          - bankCode
          - bankName
          - accountType
          - beneficiaryId
          - address
          - email
        properties:
          accountName:
            type: string
            maxLength: 60
          accountNumber:
            type: string
            pattern: ^[0-9]{9,16}$
            description: 9-16-digit Colombian account number
          bankCode:
            type: string
            pattern: ^[A-Za-z0-9]{1,11}$
            description: 1-11 alphanumeric bank code
          accountType:
            type: string
            enum:
              - Checking
              - Saving
          email:
            type: string
            format: email
            maxLength: 100
          beneficiaryId:
            type: object
            additionalProperties: false
            required:
              - type
              - value
            properties:
              type:
                type: string
                enum:
                  - NIT
                  - CC
                  - CE
                  - TI
                  - PASS
              value:
                type: string
            allOf:
              - if:
                  properties:
                    type:
                      const: NIT
                then:
                  properties:
                    value:
                      pattern: ^\d{9,11}$
              - if:
                  properties:
                    type:
                      const: CC
                then:
                  properties:
                    value:
                      pattern: ^\d{6,10}$
          address:
            type: object
            additionalProperties: false
            required:
              - line1
              - city
              - countryCode
            properties:
              line1:
                type: string
                maxLength: 70
              city:
                type: string
                maxLength: 50
              countryCode:
                const: CO
