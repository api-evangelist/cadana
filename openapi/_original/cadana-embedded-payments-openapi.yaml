openapi: 3.0.0
info:
  description: APIs for interacting with Cadana Global Payments
  version: 1.0.0
  title: Embedded Payments
  termsOfService: https://cadanapay.com/terms-and-conditions
  contact:
    email: api@cadanapay.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://api.cadanapay.com
    description: Prod Server
  - url: https://dev-api.cadanapay.com
    description: Dev Server
security:
  - Authorization: []
tags:
  - name: Beneficiaries
    description: APIs for managing beneficiaries
  - name: Payouts
    description: APIs for managing payouts
  - name: Balances
    description: APIs for managing account balances
  - name: FX
    description: APIs for managing foreign exchange rates
  - name: Resources
    description: Resource APIs to access and manage foundational data
  - name: Virtual Accounts
    description: APIs for managing virtual accounts
paths:
  /v1/beneficiaries:
    post:
      summary: Create
      description: Create a new beneficiary i.e employee/contractor's payout account
      tags:
        - Beneficiaries
      security:
        - Authorization: []
      parameters:
        - $ref: '#/components/parameters/XMultiTenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBeneficiaryRequest'
            examples:
              philippinesBankPaymentMethod:
                $ref: '#/components/examples/philippinesBankPaymentMethod'
              colombiaBankPaymentMethod:
                $ref: '#/components/examples/colombiaBankPaymentMethod'
              mexicoBankPaymentMethod:
                $ref: '#/components/examples/mexicoBankPaymentMethod'
              elSalvadorBankPaymentMethod:
                $ref: '#/components/examples/elSalvadorBankPaymentMethod'
              momoPaymentMethod:
                $ref: '#/components/examples/momoPaymentMethod'
      responses:
        '200':
          $ref: '#/components/responses/CreateBeneficiaryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      summary: List
      description: Retrieve beneficiaries
      tags:
        - Beneficiaries
      parameters:
        - $ref: '#/components/parameters/XMultiTenantKey'
      responses:
        '200':
          $ref: '#/components/responses/GetBeneficiariesResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /v1/beneficiaries/{beneficiaryId}:
    get:
      summary: Get
      description: Get an existing beneficiary
      tags:
        - Beneficiaries
      parameters:
        - $ref: '#/components/parameters/beneficiaryId'
        - $ref: '#/components/parameters/XMultiTenantKey'
      responses:
        '200':
          $ref: '#/components/responses/GetBeneficiaryResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        5XX:
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete
      description: Delete an existing beneficiary
      parameters:
        - $ref: '#/components/parameters/beneficiaryId'
        - $ref: '#/components/parameters/XMultiTenantKey'
      tags:
        - Beneficiaries
      responses:
        '204':
          description: Successful operation
        '404':
          $ref: '#/components/responses/NotFoundError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /v1/files/upload-url:
    post:
      summary: Create upload URL
      description: |
        Reserve a file ID and receive a short-lived HTTPS **PUT** URL.
        After the client uploads the bytes to that URL, it can reference
        `fileId` in later API calls (e.g. Beneficiary creation KYC).
      tags:
        - Beneficiaries
      security:
        - Authorization: []
      parameters:
        - $ref: '#/components/parameters/XMultiTenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
            examples:
              kycFront:
                summary: JPEG passport front
                value:
                  purpose: kyc-id-front
                  contentType: image/jpeg
      responses:
        '200':
          $ref: '#/components/responses/UploadUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /v1/files/{fileId}:
    get:
      summary: Get file details
      description: Get details and a download URL for a file by its fileId
      tags:
        - Beneficiaries
      security:
        - Authorization: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier for the file
        - $ref: '#/components/parameters/XMultiTenantKey'
      responses:
        '200':
          $ref: '#/components/responses/GetFileDetailsResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /v1/payouts:
    post:
      summary: Create
      description: Create a new payout
      tags:
        - Payouts
      parameters:
        - $ref: '#/components/parameters/XMultiTenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayoutRequest'
            examples:
              payoutRequest:
                summary: Example payout request
                value:
                  beneficiaryId: c871b333-e129-409c-aabd-7cfb55a967cc
                  quoteId: d35d2bd6-188b-4e82-9a16-71442dad7375
                  amount:
                    amount: 500000
                    currency: PHP
                  reference: payout-123
      responses:
        '200':
          $ref: '#/components/responses/CreatePayoutRespone'
        '400':
          $ref: '#/components/responses/BadRequestError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      summary: List
      description: Retrieve payouts
      tags:
        - Payouts
      parameters:
        - name: reference
          in: query
          required: false
          description: Client reference to filter payouts
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by payout status
          schema:
            type: string
            enum:
              - initiated
              - processing
              - succeeded
              - failed
        - name: startDate
          in: query
          required: false
          description: Filter payouts created on or after this date (ISO 8601)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: Filter payouts created on or before this date (ISO 8601)
          schema:
            type: string
            format: date
        - name: order
          in: query
          required: false
          description: Sort order by creation date
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: cursor
          in: query
          required: false
          description: Pagination cursor returned from a previous request
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            default: 20
        - name: format
          in: query
          required: false
          description: >-
            Response format. When set to `csv`, returns all matching payouts as
            a CSV file download. Requires `startDate` and `endDate`.
          schema:
            type: string
            enum:
              - csv
        - $ref: '#/components/parameters/XMultiTenantKey'
      responses:
        '200':
          $ref: '#/components/responses/GetPayoutsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /v1/payouts/{payoutId}:
    get:
      summary: Get
      description: Get an existing payout
      parameters:
        - $ref: '#/components/parameters/payoutId'
        - $ref: '#/components/parameters/XMultiTenantKey'
      tags:
        - Payouts
      responses:
        '200':
          $ref: '#/components/responses/GetPayoutResponse'
  /v1/businesses/{businessId}/balances:
    get:
      summary: Get account balances
      description: Get a business's account balances
      operationId: getBusinessBalances
      tags:
        - Balances
      parameters:
        - $ref: '#/components/parameters/businessId'
        - $ref: '#/components/parameters/XMultiTenantKey'
      responses:
        '200':
          $ref: '#/components/responses/GetBalancesResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        5XX:
          $ref: '#/components/responses/InternalError'
      security:
        - Authorization: []
  /v1/businesses/{businessId}/funding-details:
    get:
      summary: Get funding details
      description: Returns the business's funding details.
      operationId: getFundingDetails
      tags:
        - Balances
      parameters:
        - $ref: '#/components/parameters/businessId'
        - $ref: '#/components/parameters/XMultiTenantKey'
      responses:
        '200':
          $ref: '#/components/responses/GetFundingDetailsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        5XX:
          $ref: '#/components/responses/InternalError'
      security:
        - Authorization: []
  /v1/businesses/{businessId}/crypto-deposit-addresses:
    post:
      summary: Create crypto deposit address
      description: >-
        Creates a crypto deposit address for the business on the given chain.
        Fails if an address already exists for that currency and chain.
      operationId: createCryptoDepositAddress
      tags:
        - Balances
      parameters:
        - $ref: '#/components/parameters/businessId'
        - $ref: '#/components/parameters/XMultiTenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currency
                - chain
              properties:
                currency:
                  type: string
                  enum:
                    - USDC
                    - USDT
                  description: Stablecoin to receive
                  example: USDC
                chain:
                  type: string
                  description: >-
                    Blockchain network. USDC: ethereum, solana, arbitrum, base,
                    polygon. USDT: ethereum, solana, tron.
                  example: ethereum
      responses:
        '200':
          description: Crypto deposit address created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  currency:
                    type: string
                    example: USDC
                  chain:
                    type: string
                    example: ethereum
                  address:
                    type: string
                    example: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e'
        '400':
          description: >-
            Bad request — an unsupported currency/chain, or a deposit address
            already exists for that currency and chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
              example:
                code: invalid_request_body
                message: >-
                  One or more input values are invalid. Please re-enter valid
                  values
                params:
                  chain: currency and chain combination already exists
        5XX:
          $ref: '#/components/responses/InternalError'
      security:
        - Authorization: []
  /v1/payment-requirements:
    get:
      summary: Payment corridor requirements
      description: >
        Returns a Draft-07 JSON-Schema fragment that specifies every field,
        enum, regex and conditional rule for the requested `countryCode` +
        `currency` + `paymentMethod`.
      tags:
        - Resources
      operationId: getPaymentRequirements
      parameters:
        - name: countryCode
          in: query
          required: true
          schema:
            type: string
            example: CO
        - name: paymentMethod
          in: query
          required: true
          schema:
            type: string
            example: bank
        - name: currency
          in: query
          required: true
          schema:
            type: string
            example: COP
        - $ref: '#/components/parameters/XMultiTenantKey'
      responses:
        '200':
          description: Draft-07 JSON-Schema fragment
          content:
            application/schema+json:
              schema:
                $ref: '#/components/schemas/JSONSchemaDraft07'
              examples:
                colombiaBank:
                  $ref: '#/components/examples/coBankSchema'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /v1/providers:
    get:
      summary: Get payout providers
      description: Get a list of providers for a given country code
      tags:
        - Resources
      parameters:
        - name: countryCode
          in: query
          required: true
          description: The country code in ISO 3166-1 alpha-2 format
          schema:
            type: string
          example: BR
        - $ref: '#/components/parameters/XMultiTenantKey'
      responses:
        '200':
          $ref: '#/components/responses/GetProvidersResponse'
  /v1/providers/resolve:
    get:
      summary: Resolve bank provider
      description: >-
        Resolves a bank code, SWIFT code, or ACH routing number to the
        corresponding bank name and details. The behaviour depends on the
        `paymentMethod` parameter:

        - **swift** — resolves an 8 or 11-character SWIFT/BIC code

        - **ach** — resolves a 9-digit US ACH routing number

        - **bank** — resolves against Cadana's internal bank provider list
          for the given currency
      tags:
        - Resources
      parameters:
        - name: code
          in: query
          required: true
          description: The bank code, SWIFT code, or routing number to look up
          schema:
            type: string
          example: '341'
        - name: currency
          in: query
          required: true
          description: ISO 4217 currency code
          schema:
            type: string
          example: BRL
        - name: paymentMethod
          in: query
          required: true
          description: 'Payment method type: swift, ach, or bank'
          schema:
            type: string
            enum:
              - swift
              - ach
              - bank
          example: bank
        - $ref: '#/components/parameters/XMultiTenantKey'
      responses:
        '200':
          $ref: '#/components/responses/ResolveCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
  /v1/payment-methods:
    get:
      summary: Get payment methods
      description: Get a list of available payment methods for a given country code
      tags:
        - Resources
      operationId: getPaymentMethods
      parameters:
        - name: countryCode
          in: query
          required: false
          description: The country code in ISO 3166-1 alpha-2 format
          schema:
            type: string
          example: BR
        - name: paymentMethod
          in: query
          required: false
          description: The payment method to filter by
          schema:
            type: string
          example: bank
        - name: currency
          in: query
          required: false
          description: The currency to filter by
          schema:
            type: string
          example: USD
        - $ref: '#/components/parameters/XMultiTenantKey'
      responses:
        '200':
          $ref: '#/components/responses/GetPaymentMethodsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /v1/fx-quotes:
    post:
      summary: Create FX Quote
      description: Create an fx quote
      tags:
        - FX
      parameters:
        - $ref: '#/components/parameters/XMultiTenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFXQuoteRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateFXQuoteResponse'
  /v1/users/{userId}/virtual-accounts:
    post:
      summary: Create Virtual Account
      description: Create a new virtual account for a user
      tags:
        - Virtual Accounts
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/XMultiTenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualAccountRequest'
            examples:
              virtualAccountRequest:
                summary: >-
                  Example virtual account creation request. Use `99999900` as
                  customIdentification.number for automatic account creation
                value:
                  currency: USD
                  customIdentification:
                    type: ssn
                    number: 123-45-6789
                  jobInformation:
                    employerName: Acme Corp
                    address:
                      line1: 123 Main St
                      city: Anytown
                      postalCode: '12345'
                      state: CA
                      countryCode: US
                    employerWebsite: ''
                    title: Software Engineer
                    type: full-time
                    netPay:
                      amount: 10000
                      currency: USD
                    frequency: monthly
                    contractStartDate: '2021-01-01'
                    contractEndDate: '2025-05-06'
                  suppressNotification: true
      responses:
        '204':
          description: Successful operation
        '400':
          $ref: '#/components/responses/BadRequestError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      summary: Get Virtual Accounts
      description: Retrieve virtual accounts for a user
      tags:
        - Virtual Accounts
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/XMultiTenantKey'
      responses:
        '200':
          $ref: '#/components/responses/GetVirtualAccountsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /v1/sandbox/users/{userId}/virtual-accounts/{virtualAccountId}/deposit:
    post:
      summary: Simulate virtual account deposit
      description: Simulate a virtual account deposit for an active virtual account
      tags:
        - Virtual Accounts
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/virtualAccountId'
        - $ref: '#/components/parameters/XMultiTenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateVirtualAccountDepositRequest'
            examples:
              simulateVirtualAccountDepositRequest:
                summary: Example virtual account creation request
                value:
                  amount:
                    amount: 10000
                    currency: USD
                  reference: c06f3427-3bbe-4d70-9a54-28acda267e48
                  description: Payroll 10/10
      responses:
        '204':
          description: Successful operation
        '400':
          $ref: '#/components/responses/BadRequestError'
        5XX:
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    JSONSchemaDraft07:
      description: >
        This is a Draft-07 JSON Schema fragment. For the full meta-schema, see
        https://json-schema.org/draft-07/schema#. 

        Rely on the provided example for the expected structure.
    uuid:
      type: string
      format: uuid
      example: 8ef9a712-cdae-4110-b1ea-9ba95abbee6e
    amount:
      type: object
      required:
        - value
        - currency
      properties:
        value:
          type: integer
          description: value in lowest denomination
          example: 10000
        currency:
          type: string
          description: currency
          example: USD
    balance:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 517075a2-17db-469f-9481-eb8347cb920c
        currency:
          type: string
          example: USD
        balance:
          type: integer
          description: value in lowest denomination
          example: 703448
        available:
          type: integer
          description: value in lowest denomination
          example: 703448
        processing:
          type: integer
          description: value in lowest denomination
          example: 0
    fxQuote:
      type: object
      required:
        - id
        - from
        - to
        - rate
        - expirationTimestamp
      properties:
        id:
          type: string
          format: uuid
          example: 57c74c5d-38a0-41e7-a19e-161f16dc4898
        from:
          type: string
          example: USD
        to:
          type: string
          example: PHP
        rate:
          type: string
          example: '56.1234'
        expirationTimestamp:
          type: string
          format: date-time
          example: '2025-05-29T21:42:52Z'
    kycMinimal:
      description: KYC attributes for a beneficiary
      type: object
      required:
        - firstName
        - lastName
        - dateOfBirth
        - countryCode
        - idType
        - idNumber
        - idFileFront
      properties:
        firstName:
          type: string
          maxLength: 50
          example: Jane
        lastName:
          type: string
          maxLength: 50
          example: Roe
        dateOfBirth:
          type: string
          format: date
          example: '1990-08-15'
        countryCode:
          type: string
          description: Country issuing the ID (ISO 3166-1 alpha-2)
          example: CO
        idType:
          type: string
          enum:
            - PASSPORT
            - NATIONAL_ID
            - DRIVER_LICENSE
            - RESIDENCE_PERMIT
            - OTHER
          example: NATIONAL_ID
        idNumber:
          type: string
          maxLength: 30
          example: '76543210'
        idFileFront:
          type: string
          format: uuid
          description: fileId returned by **POST /v1/files/upload-url**
          example: 7a7f80a6-1665-4f64-9ef3-d5f90f8f309b
        idFileBack:
          type: string
          format: uuid
          description: Optional second side of the ID
          example: 7a7f80a6-1665-4f64-9ef3-d5f90f8f309b
    CreateFXQuoteRequest:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          example: USD
        to:
          type: string
          example: PHP
    CreateBeneficiaryRequest:
      type: object
      required:
        - name
        - countryCode
        - currency
        - paymentDetails
        - kyc
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        countryCode:
          type: string
          description: The country code of the beneficiary in ISO 3166-1 alpha-2 format
          example: KE
        currency:
          type: string
          description: The currency of the beneficiary in ISO 4217 format
          example: KES
        paymentDetails:
          $ref: '#/components/schemas/paymentDetails'
        kyc:
          $ref: '#/components/schemas/kycMinimal'
    Beneficiary:
      allOf:
        - $ref: '#/components/schemas/CreateBeneficiaryRequest'
        - type: object
          required:
            - id
            - createdTimestamp
            - lastUpdatedTimestamp
          properties:
            id:
              type: string
              format: uuid
              example: 7a7f80a6-1665-4f64-9ef3-d5f90f8f309b
            createdTimestamp:
              type: integer
              description: Unix timestamp when the beneficiary was created
              example: 1748478276
            lastUpdatedTimestamp:
              type: integer
              description: Unix timestamp when the beneficiary was last updated
              example: 1748478276
    meta:
      type: object
      description: Meta about the pagination
      properties:
        limit:
          type: number
          example: 1
        currentPage:
          type: number
          example: 1
        skipped:
          type: number
          example: 1
        pages:
          type: number
          example: 1
        itemCount:
          type: number
          example: 1
    address:
      type: object
      required:
        - line1
        - city
        - postalCode
        - state
        - countryCode
      properties:
        line1:
          type: string
          description: Address line 1
          example: Lane 1
        line2:
          type: string
          description: Address line 2
          example: Apt 1
        city:
          type: string
          description: The city of the address
          example: Gotham City
        postalCode:
          type: string
          description: The postal code
          example: '10001'
        state:
          type: string
          description: The state for the address
          example: NY
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: US
    paymentDetails:
      type: object
      required:
        - preferredMethod
      properties:
        preferredMethod:
          type: string
          enum:
            - momo
            - bank
            - swift
            - ach
            - wallet
            - crypto
            - proxy
          description: The preferred payment method type
          example: bank
        momo:
          $ref: '#/components/schemas/momoDetails'
        bank:
          $ref: '#/components/schemas/bankDetails'
        swift:
          $ref: '#/components/schemas/swiftDetails'
        ach:
          $ref: '#/components/schemas/achDetails'
        wallet:
          $ref: '#/components/schemas/walletDetails'
        cryptoWallet:
          $ref: '#/components/schemas/cryptoWalletDetails'
        proxy:
          $ref: '#/components/schemas/proxyDetails'
    proxyDetails:
      type: object
      properties:
        accountName:
          type: string
          description: The name associated with the proxy account
          example: John Doe
        ownerType:
          type: string
          description: The type of account owner (individual, business)
          example: individual
        type:
          type: string
          description: The type of proxy payment system
          example: pix
        value:
          type: string
          description: The proxy identifier value
          example: '+5511998765432'
        beneficiaryId:
          $ref: '#/components/schemas/beneficiaryId'
        address:
