      type: object
      description: An invoice document
      properties:
        id:
          $ref: "#/components/schemas/uuid"
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - partially paid
            - paid
            - overdue
            - cancelled
          example: paid
        source:
          type: string
          enum:
            - SYSTEM
            - USER
            - REIMBURSEMENT
            - PAYROLL
            - CONTRACTOR_SUBMITTED
          description: >-
            Origin of the invoice. Only invoices with source CONTRACTOR_SUBMITTED
            are reviewable via the review endpoint.
          example: CONTRACTOR_SUBMITTED
        invoiceNumber:
          type: string
          example: "1764332528"
          description: Human-readable invoice number
        date:
          type: string
          format: date
          example: "2025-11-28"
          description: Invoice date
        dueDate:
          type: string
          format: date
          example: "2025-11-26"
          description: Payment due date
        from:
          $ref: "#/components/schemas/invoiceParty"
          description: Invoice issuer
        billTo:
          $ref: "#/components/schemas/invoiceParty"
          description: Invoice recipient
        items:
          type: array
          items:
            $ref: "#/components/schemas/invoiceLineItem"
        subtotal:
          $ref: "#/components/schemas/amount"
          description: Subtotal before any adjustments
        total:
          $ref: "#/components/schemas/amount"
          description: Total amount due
        baseCurrency:
          type: string
          example: USD
          description: Base currency for the invoice
        fxRates:
          type: object
          description: Exchange rates used in this invoice
          additionalProperties:
            type: number
            format: float
          example:
            USD-EUR: 0.863673
            USD-PHP: 58.208258
        purpose:
          type: string
          example: Payment Processing Fee
          description: Purpose of the invoice
        notes:
          type: string
          example: Payment for services rendered
          description: Additional notes
        createdTimestamp:
          type: integer
          format: int64
          example: 1764332530
          description: Unix timestamp when invoice was created
        lastUpdatedTimestamp:
          type: integer
          format: int64
          example: 1764339673
          description: Unix timestamp when invoice was last updated
    CreatePayrollRequest:
      required:
        - workerType
        - type
      type: object
      properties:
        workerType:
          type: string
          description: worker type
          example: EMPLOYEE
          enum:
            - EMPLOYEE
            - CONTRACTOR
        type:
          type: string
          description: payroll type
          example: ONE_OFF
          enum:
            - ONE_OFF
            - REGULAR
        tags:
          $ref: "#/components/schemas/tags"
    payrollEntryInput:
      required:
        - salary
        - personId
      type: object
      properties:
        personId:
          $ref: "#/components/schemas/uuid"
        salary:
          allOf:
            - $ref: "#/components/schemas/amount"
          description: >-
            Base rate per the person's compensation frequency. For a
            salaried-monthly person this is the period amount; for an
            hourly/daily person this is the rate per hour/day. The frequency
            itself comes from the person's stored `compInfo.frequency` —
            never sent on the entry.
        timeWorked:
          type: number
          description: >-
            Units of work in the period (e.g. `160` hours, `20` days, or `1`
            for a salaried-monthly person). The unit is implied by the
            person's `compInfo.frequency`. When omitted the engine defaults
            to `1`, which is the correct value for salaried workers paid one
            period.
          example: 160
        overtime:
          allOf:
            - $ref: "#/components/schemas/amount"
          description: >-
            Overtime rate (when paired with `overtimeWorked`, e.g. $37.50/hr
            × 10 hours) or a flat overtime amount (when `overtimeWorked` is
            omitted, e.g. $500 of overtime this period). Sending
            `overtimeWorked` without `overtime` is rejected.
        overtimeWorked:
          type: number
          description: >-
            Overtime units worked in the period (e.g. `10` hours of
            overtime). Multiplies against `overtime` when both are provided.
            Must be non-negative. The unit is implied by the person's
            `compInfo.frequency`.
          example: 10
        bonus:
          $ref: "#/components/schemas/amount"
        commission:
          $ref: "#/components/schemas/amount"
        allowances:
          type: array
          description: >-
            Non-statutory allowance line items applied to this entry (e.g.
            housing, transport stipends). Each item carries a `name`,
            `isTaxable` flag (defaults to false when omitted — pass true explicitly for taxable allowances), and `amount`.
          items:
            $ref: "#/components/schemas/allowance"
        deductions:
          type: array
          description: >-
            Voluntary (non-statutory) deduction line items to apply this
            period — e.g. voluntary pension top-ups, garnishments, equipment
            repayments. Items with `isStatutory: true` are silently dropped
            (statutory items like income tax and social security are
            computed by the tax engine and would otherwise double-count).
            This lets you round-trip a payload fetched via `GET` without
            having to filter engine-computed items first.
          items:
            $ref: "#/components/schemas/deduction"
        invoiceIds:
          type: array
          description: >-
            IDs of approved contractor invoices to pay through this entry.
            Only valid on a contractor payroll: each invoice must be a
            contractor self-submitted invoice in an approved state and belong
            to this entry's person. The invoice is marked paid when the payroll
            completes.
          items:
            $ref: "#/components/schemas/uuid"
        metadata:
          type: object
          description: >-
            Optional opaque metadata attached to the entry. Stored and
            returned unchanged. Not used in tax calculations or reports.
            Do not place regulated PII here. Keys must be 1-50 characters.
          additionalProperties:
            type: string
            maxLength: 200
          maxProperties: 20
          example:
            team: engineering
            region: emea
    SavePayroll:
      required:
        - payrollDate
        - payPeriod
        - entries
      type: object
      properties:
        payrollDate:
          type: string
          description: payroll date
          format: date
        payPeriod:
          $ref: "#/components/schemas/payPeriod"
        fxRateExpiresAt:
          type: string
          format: date-time
          description: >
            Maximum time the quoted FX rates are valid (RFC 3339).
            If omitted, spot rates are used.
          example: "2025-06-15T23:59:59Z"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/payrollEntryInput"
        customFees:
          type: array
          description: >
            Optional custom fee line items that supplement the standard
            per-seat subscription fees.
          items:
            type: object
            required:
              - name
              - amount
            properties:
              name:
                type: string
                description: Name of the fee
                example: Platform Fee
              amount:
                $ref: "#/components/schemas/amount"
              metadata:
                type: object
                description: >-
                  Optional opaque metadata attached to the fee. Stored and
                  returned unchanged. Not used in tax calculations or reports.
                  Do not place regulated PII here. Keys must be 1-50 characters.
                additionalProperties:
                  type: string
                  maxLength: 200
                maxProperties: 20
                example:
                  team: engineering
                  region: emea
        tags:
          $ref: "#/components/schemas/tags"
    payrollSummary:
      type: object
      properties:
        payrollId:
          type: string
          description: created payroll id
          format: uuid
        workerType:
          type: string
          description: worker type
          example: EMPLOYEE
          enum:
            - EMPLOYEE
            - CONTRACTOR
        status:
          allOf:
            - $ref: "#/components/schemas/payrollStatus"
          description: Current payroll status. Values are title-cased (e.g. `Pending Submission`, `Scheduled`, `Completed`).
        numPeople:
          type: integer
          description: number of people in payroll run
          example: 50
        type:
          type: string
          description: payroll type
          example: ONE-OFF
          enum:
            - ONE-OFF
            - REGULAR
        payrollDate:
          type: string
          description: payroll date
          format: date
        debit:
          allOf:
            - $ref: "#/components/schemas/amount"
          description: >-
            Total amount deducted from the business balance for this payroll.
            For direct employment this is net pay plus fees; for EOR workers
            (`compInfo.employmentModel: "eor"`) it is gross pay plus employer
            contributions, so statutory amounts are collected.
        gross:
          allOf:
            - $ref: "#/components/schemas/amount"
          description: Total gross pay across all entries, before deductions.
        net:
          allOf:
            - $ref: "#/components/schemas/amount"
          description: Total net (take-home) pay across all entries.
        tax:
          allOf:
            - $ref: "#/components/schemas/amount"
          description: Total income tax withheld across all entries. Returned for `EMPLOYEE` payrolls only; omitted for contractor payrolls.
        pension:
          allOf:
            - $ref: "#/components/schemas/amount"
          description: Combined employee and employer retirement contributions across all entries; the employee and employer portions are also included in `statutoryDeductions` and `employerContributions` respectively. Returned for `EMPLOYEE` payrolls only; omitted for contractor payrolls.
        statutoryDeductions:
          allOf:
            - $ref: "#/components/schemas/amount"
          description: Total of all employee-side statutory deductions, including income tax and social security, across all entries. Returned for `EMPLOYEE` payrolls only; omitted for contractor payrolls.
        employerContributions:
          allOf:
            - $ref: "#/components/schemas/amount"
          description: Total employer contributions across all entries (e.g., employer-side social security). Returned for `EMPLOYEE` payrolls only; omitted for contractor payrolls.
        payPeriod:
          allOf:
            - $ref: "#/components/schemas/payPeriod"
          description: The pay period this payroll covers.
    signer:
      type: object
      properties:
        email:
          type: string
          example: batman@gothammail.com
          format: email
        name:
          type: string
          example: Batman Jr
    FileDetails:
      type: object
      required:
        - fileId
        - purpose
        - getUrl
        - expiresIn
        - createdAt
        - tenantKey
      properties:
        fileId:
          type: string
          format: uuid
          example: 1d3f870c-bc91-4636-a0d4-8e54bccf7d64
        purpose:
          type: string
          description: Logical reason for the upload
          enum:
