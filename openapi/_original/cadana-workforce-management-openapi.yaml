  /v1/platform/disbursements:
    get:
      summary: List Disbursements
      description: Retrieve all disbursements across all businesses under the platform. Use this endpoint for financial reconciliation across your sub-businesses.
      operationId: getPlatformDisbursements
      tags:
        - Platform
      parameters:
        - in: query
          name: businessId
          schema:
            type: string
            format: uuid
          description: >
            Scope results to a single business account. Returns only rows where that
            business's account is the sender or recipient — both money it sent
            (payroll, vendor payments, payouts) and money it received (deposits,
            refunds/reversals). This is narrower than `tenantKey`, which returns
            every row under a tenant.
          example: 1e6c5a83-7b86-4a32-a7da-0e5e2b3d8f10
        - in: query
          name: currency
          schema:
            type: string
          description: Filter by the business-facing currency — matches either the destination `amount` or the `sourceAmount`.
          example: USD
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Start of date range (ISO 8601, e.g. 2026-01-01). Defaults to 7 days ago.
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: End of date range (ISO 8601, e.g. 2026-02-01). Defaults to now.
        - in: query
          name: type
          schema:
            type: string
          description: >
            Comma-separated, repeatable filter of disbursement type(s) to include.
            Supported values: PAYROLL, PAYOUT, TRANSFER, CARD_MAINTENANCE_FEE, CARD_CREATION_FEE, STOCK_BUY, STOCK_SELL, PAYROLL_FEE, INTEREST.
            When scoped to a single business with `businessId`, the business-relevant
            types are PAYROLL_TOTAL, PAYROLL, PAYROLL_FEE, PAYROLL_REVERSAL, DEPOSIT,
            DEPOSIT_REVERSAL, VENDOR, REVENUE_SHARE_PAYOUT, REIMBURSEMENT,
            SUBSCRIPTION_PAYMENT, STATUTORY_DEPOSIT; by default the per-employee
            PAYROLL legs and PAYROLL_FEE are collapsed into the single PAYROLL_TOTAL
            row, and passing an explicit `type` returns the raw rows.
          example: PAYROLL,PAYOUT
        - in: query
          name: status
          schema:
            type: string
            enum:
              - SUCCESS
              - FAILED
              - INITIATED
              - PROCESSING
              - ROUTED
          description: Filter by transaction status.
          example: SUCCESS
        - in: query
          name: includeRevenueShare
          schema:
            type: boolean
            default: false
          description: Set to `true` to include the revenue-share fields (`feeRevenueShare`, `fxRevenueShare`, `totalRevenueShare`) in each item. Omitted by default.
          example: true
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 50
            maximum: 100
          description: Maximum number of items to return per page.
        - in: query
          name: next
          schema:
            type: string
          description: Opaque cursor for the next page — pass the `cursor.next` value from the previous response. Keep paging until `cursor.next` is null.
        - in: query
          name: previous
          schema:
            type: string
          description: Cursor to fetch the previous page of results.
      responses:
        "200":
          $ref: "#/components/responses/GetPlatformDisbursementsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/platform/disbursements/{disbursementId}:
    get:
      summary: Get Disbursement
      description: Fetch a single disbursement by ID.
      operationId: getPlatformDisbursement
      tags:
        - Platform
      parameters:
        - $ref: "#/components/parameters/disbursementId"
      responses:
        "200":
          $ref: "#/components/responses/GetPlatformDisbursementResponse"
        "400":
