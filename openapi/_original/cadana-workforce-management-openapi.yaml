    UpdatePersonTaxProfileRequest:
      description: >-
        Update a person's tax profile. The submitted object replaces the
        person's entire tax profile — it is not a merge, so omitted fields are
        cleared. Updates are applied asynchronously; a subsequent GET may
        briefly return the previous profile. The accepted fields vary by
        country — use the [required fields endpoint](/api-reference/statutory/jurisdictions/get-required-fields-for-tax-calculation-and-statutory-filing)
        or [tax fields endpoint](/api-reference/tax/tax-calculator/list-required-additional-tax-fields-by-country)
        to discover which fields are needed for a given jurisdiction.
      type: object
      additionalProperties: true
      example:
        maritalStatus: single
        numberOfDependents: 2
    GetPersonTaxProfileResponse:
      type: object
      properties:
        taxProfile:
          type: object
          additionalProperties: true
          description: >-
            The person's tax profile. Empty if none set. Includes a read-only,
            server-derived `countryCode` field; remove it from the payload
            before resubmitting via PUT, which rejects unknown fields.
          example:
            countryCode: DE
            maritalStatus: single
            numberOfDependents: 2
