          examples:
            employeePayroll:
              summary: Employee payroll with tax, pension, and per-entry breakdown
              value:
                payrollId: 7c4f1d36-2b9a-4bca-91e7-2b1f1e6e7c11
                workerType: EMPLOYEE
                type: REGULAR
                status: Pending Submission
                payrollDate: "2021-06-26"
                debit:
                  amount: 31947900
                  currency: PHP
                gross:
                  amount: 31947900
                  currency: PHP
                net:
                  amount: 31947900
                  currency: PHP
                tax:
                  amount: 0
                  currency: PHP
                pension:
                  amount: 0
                  currency: PHP
                statutoryDeductions:
                  amount: 0
                  currency: PHP
                employerContributions:
                  amount: 0
                  currency: PHP
                payPeriod:
                  fromDate: "2021-06-01"
