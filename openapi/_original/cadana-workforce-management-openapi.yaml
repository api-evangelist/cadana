                        example: https://storage.example.com/contracts/d52e4a13-7b6f-4c8d-a9e1-2f3b5c7d8e9a.pdf?token=abc123&expires=900
                      downloadUrlExpiresAt:
                        type: integer
                        description: Epoch timestamp when the download URL expires. Only included when includeDownloadUrl=true.
                        example: 1689760750
