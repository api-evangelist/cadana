          description:
            File ID of the selfie with the identification document. In sandbox, can be omitted when a
            sentinel value is used
    CreatePersonRequest:
      description: Create person request payload
      type: object
      allOf:
        - $ref: "#/components/schemas/basicInfo"
        - $ref: "#/components/schemas/tags"
      required:
        - type
        - email
        - firstName
        - lastName
        - address
        - compInfo
      properties:
        businessName:
          type: string
          description: Business name, required if contractor type is business
          example: Wayne Enterprise
        type:
          type: string
          example: CONTRACTOR
          description: Type of the person, we allow contractors and employees
          enum:
            - EMPLOYEE
            - CONTRACTOR
        contractorType:
          type: string
          example: INDIVIDUAL
          description:
            Type of the contractor, only required if person is a contractor type, we allow individual and business
            type contractors
          enum:
            - INDIVIDUAL
            - BUSINESS
        address:
          $ref: "#/components/schemas/address"
        compInfo:
          $ref: "#/components/schemas/compInfo"
        jobInfo:
          $ref: "#/components/schemas/jobInfo"
        metadata:
          type: object
          additionalProperties: true
          description: Optional metadata you can store as key-value pairs
          example:
            customField1: value1
            customField2: value2
    FundingDetails:
      type: object
      required:
        - type
        - currency
      properties:
        type:
          type: string
          enum:
            - ach
            - wire
            - iban
            - bank
            - swift
            - crypto
          description: The type of funding method
          example: ach
        currency:
          type: string
          description: ISO 4217 currency code
          example: USD
        accountName:
          type: string
          description: Name on the account
          example: Acme Corp
        accountNumber:
          type: string
          description: Account number (for ACH, bank, wire) or IBAN (for iban type)
          example: "123456789"
        routingNumber:
          type: string
          description: Routing number (for ACH, bank, wire)
          example: "000000000"
        bankName:
          type: string
          description: Name of the bank
          example: Example Bank
        accountType:
          type: string
          enum:
            - Checking
            - Savings
          description: Type of account (for ACH, bank)
          example: Checking
        swiftCode:
          type: string
          description: SWIFT/BIC code (for iban, swift types)
          example: EXMPGB2L
        country:
          type: string
          description: Country code (for iban type)
          example: GB
        address:
          type: string
          description: Crypto wallet address (for crypto type)
          example: "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
        chain:
          type: string
          description: Blockchain chain (for crypto type)
          example: ETH
        cryptoType:
          type: string
          description: Type of cryptocurrency (for crypto type)
          example: USDC
        memo:
