            - internal_error
        message:
          description: A human readable message describing the error
          type: string
    BadRequestError:
      description: Bad input provided by client
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            params:
              description: A map for meta data around the error that occurred
              type: object
      example:
        code: invalid_request_body
        message: The request body provided is not valid
        params:
          field: Value is invalid.
    NotFoundError:
      description: Not Found
      allOf:
        - $ref: "#/components/schemas/Error"
      example:
        code: resource_not_found
        message: Requested resource could not be found.
    InternalError:
      description: Internal server error
      allOf:
        - $ref: "#/components/schemas/Error"
      example:
        code: internal_error
        message: An unexpected error occurred. Please try again later.
    ForbiddenError:
      description: Forbidden
      allOf:
        - $ref: "#/components/schemas/Error"
      example:
        code: forbidden
        message: Transfers are only available to platform businesses.
    CreateTransferRequest:
      type: object
      required:
        - destinationTenantKey
        - amount
        - reference
      properties:
        sourceTenantKey:
          type: string
          description: The business funds move from. Omit to send from your main business, or pass a child business's tenant key.
          example: blm123456
        destinationTenantKey:
          type: string
          description: The business funds move to — a child business or your main business. Cannot equal the source.
          example: blm998877
        amount:
          type: object
          required:
            - amount
            - currency
          properties:
            amount:
              type: integer
              description: Value in the lowest denomination of the currency (e.g. cents)
              example: 500000
            currency:
              type: string
              description: ISO 4217 code. Source and destination must match — cross-currency is not supported.
              example: USD
        reference:
          type: string
          description: Your client reference for the transfer. Stored on it so you can locate it later.
          example: transfer-123
    Amount:
      type: object
      required:
        - value
        - currency
      properties:
        value:
          type: string
          description: The value of the amount
          example: "10.00"
        currency:
          type: string
          description: The currency of the asset
          example: USD
    AddMilestoneRequest:
      type: object
      required:
        - title
        - amount
      properties:
        title:
          type: string
          description: Milestone title; also used as the invoice line-item description on completion
          example: Design phase
        description:
          type: string
          description: Optional milestone description; used as the invoice note on completion
        amount:
          $ref: "#/components/schemas/amount"
        dueDate:
          type: string
          description: Optional due date (YYYY-MM-DD)
          example: "2026-09-30"
        documentIds:
          type: array
          description: File ids from POST /v1/files/upload-url (purpose `milestone-document`); resolved to stored documents
          items:
            $ref: "#/components/schemas/uuid"
    UpdateMilestoneRequest:
      type: object
      required:
        - title
        - amount
      properties:
        title:
          type: string
          example: Design phase
        description:
          type: string
        amount:
          $ref: "#/components/schemas/amount"
        dueDate:
          type: string
          example: "2026-09-30"
        documentIds:
          type: array
          description: File ids from POST /v1/files/upload-url (purpose `milestone-document`); replace the milestone's documents
          items:
            $ref: "#/components/schemas/uuid"
    Milestone:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/uuid"
        title:
          type: string
        description:
          type: string
        amount:
          $ref: "#/components/schemas/amount"
        dueDate:
          type: string
        documents:
          type: array
          description: Attached documents (presigned download URL + original file name); present only when includeDocuments=true
          items:
            type: object
            properties:
              url:
                type: string
                description: Presigned download URL (~60-minute TTL)
              fileName:
                type: string
                description: Original upload name, or a generated fallback (e.g. document-1a2b3c4d.pdf) when none was supplied
        status:
          type: string
          enum: [Planned, Submitted, Approved, Rejected, Paid]
        rejectionReason:
          type: string
          description: Why the milestone's invoice was rejected; present only when status is Rejected
        invoiceId:
          $ref: "#/components/schemas/uuid"
        addedBy:
          type: string
          enum: [ADMIN, CONTRACTOR]
        createdTimestamp:
          type: integer
          format: int64
        updatedTimestamp:
          type: integer
          format: int64
    RevenueShare:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Amount"
        rate:
          type: number
          description: The revenue share percentage
          example: 1.0
    PlatformDisbursement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique transaction identifier
          example: 87eec1a4-d757-45be-a75e-f3638d044750
        tenantKey:
          type: string
          description: Identifies which business this transaction belongs to
          example: tbl28153208
        status:
          type: string
          description: Transaction status
          enum:
            - SUCCESS
            - FAILED
            - INITIATED
            - PROCESSING
            - ROUTED
          example: SUCCESS
        referenceId:
          type: string
          format: uuid
          description: External reference ID. Payroll transactions from the same run share the same referenceId.
          example: 9c4829a8-0177-4dad-a0d8-e4f8fc42276a
        description:
          type: string
          description: Human-readable description of the transaction
          example: January 2026 Payment
        type:
          type: string
          description: >
            Transaction type. The possible values depend on the endpoint — see the
            operation description for the set each endpoint returns. A business
            disbursement is one of: PAYROLL_TOTAL, PAYROLL, PAYROLL_FEE,
            PAYROLL_REVERSAL, DEPOSIT, DEPOSIT_REVERSAL, VENDOR,
            REVENUE_SHARE_PAYOUT, REIMBURSEMENT, SUBSCRIPTION_PAYMENT,
            STATUTORY_DEPOSIT.
          enum:
            - PAYOUT
            - PAYROLL
            - PAYROLL_TOTAL
            - PAYROLL_FEE
            - PAYROLL_REVERSAL
            - VENDOR
            - DEPOSIT
            - DEPOSIT_REVERSAL
            - REVENUE_SHARE_PAYOUT
            - REIMBURSEMENT
            - SUBSCRIPTION_PAYMENT
            - STATUTORY_DEPOSIT
            - CARD_MAINTENANCE_FEE
            - CARD_CREATION_FEE
            - STOCK_BUY
            - STOCK_SELL
            - INTEREST
          example: PAYROLL_TOTAL
        fxRate:
          type: number
          nullable: true
          description: Foreign exchange rate applied. Only present for cross-currency transactions.
          example: 5.7896
        paymentMethod:
          type: string
          description: How funds were delivered
          enum:
            - bank
            - momo
            - wallet
            - ach
            - card
            - proxy
          example: bank
        paymentDetails:
          $ref: "#/components/schemas/paymentMethods"
        userId:
          type: string
          format: uuid
          description: The wallet/user account ID. Present on wallet-based transactions. For payroll, only present when payment is delivered to a wallet.
          example: 8cb1d569-5dfd-4b33-b25e-4fab0ee14251
        personId:
          type: string
          format: uuid
          nullable: true
          description: The employee or contractor ID. Present only on payroll transactions.
          example: 7fc25070-8037-44f8-8c42-9d05ffc01f0b
        userName:
          type: string
          description: Recipient name
          example: Paula Torres
        amount:
          description: Amount the recipient receives in the destination currency
          allOf:
            - $ref: "#/components/schemas/Amount"
        sourceAmount:
          description: Cost in the source currency before fees
          allOf:
            - $ref: "#/components/schemas/Amount"
        feeAmount:
          description: Fees charged in the source currency
          allOf:
            - $ref: "#/components/schemas/Amount"
        totalAmount:
          description: Total debited from the sender (sourceAmount + feeAmount)
          allOf:
            - $ref: "#/components/schemas/Amount"
        fxRevenueShare:
          nullable: true
          description: Revenue earned from the FX spread. Only present when applicable.
          allOf:
            - $ref: "#/components/schemas/RevenueShare"
        feeRevenueShare:
          nullable: true
          description: Revenue earned from transaction fees. Only present when applicable.
          allOf:
            - $ref: "#/components/schemas/RevenueShare"
        totalRevenueShare:
          nullable: true
          description: Combined total revenue share
          allOf:
            - $ref: "#/components/schemas/Amount"
        estimatedDelivery:
          type: string
          nullable: true
          description: Estimated time the funds will be delivered to the recipient
        externalReference:
          type: string
          nullable: true
          description: External reference associated with the transaction, when available
        createdTimestamp:
          type: string
          description: Timestamp when the transaction was created
          example: "2026-01-28 14:29:09 +0000 UTC"
        lastUpdatedTimestamp:
          type: string
          description: Timestamp when the transaction was last updated
          example: "2026-01-28 14:29:18 +0000 UTC"
    node:
      type: object
      description: Node pagination
      properties:
        previous:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
    BusinessTransaction:
      type: object
      description: A business ledger transaction
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the transaction
        status:
          type: string
          description: Status of the transaction
          example: Completed
        vendorId:
          type: string
          description: ID of the vendor/recipient
        vendorName:
          type: string
          description: Name of the vendor/recipient
        reference:
          type: string
          description: Transaction reference
        direction:
          type: string
          enum:
            - DEBIT
            - CREDIT
          description: Direction of the transaction
        balanceEffect:
          type: string
          enum:
            - increase
            - decrease
          description: Effect on balance
        paymentDetails:
          $ref: "#/components/schemas/businessTransactionPaymentDetails"
        amount:
          $ref: "#/components/schemas/Amount"
        transactionFee:
          $ref: "#/components/schemas/Amount"
        totalAmount:
          $ref: "#/components/schemas/Amount"
        sourceAmount:
          $ref: "#/components/schemas/Amount"
        fxRate:
          type: number
          nullable: true
          description: FX rate if currency conversion was involved
        reason:
          type: string
          description: Reason for the transaction
        bulkPaymentReference:
          type: string
          description: Reference for bulk payments
        createdTimestamp:
          type: integer
          description: Unix timestamp when the transaction was created
        lastUpdatedTimestamp:
          type: integer
          description: Unix timestamp when the transaction was last updated
        date:
          type: string
          format: date
          description: Date of the transaction
    businessTransactionPaymentDetails:
      type: object
      description: >-
        Payment details for a business ledger transaction. Unlike a
        beneficiary's payment method, the `preferredMethod` here is a hybrid
        descriptor: it is either the underlying payment rail used, or a
        transaction-category label derived from the ledger entry type (for
        fees, payroll, statutory deposits, interest, etc.).
      required:
        - preferredMethod
      properties:
        preferredMethod:
          type: string
          enum:
            - bank
            - momo
            - swift
            - ach
            - wire
            - crypto
            - card
            - proxy
            - Transfer
            - Payment Fee
            - Payroll
            - Payroll Reversal
            - Subscription Fees
            - Statutory Deposit
            - Payroll Fees
            - Interest
          description: >-
            The payment rail or transaction category for this transaction.
            Wallet-to-wallet movements (including deposits and internal
            transfers) are always reported as `Transfer` rather than `wallet`.
            Ledger entries without an underlying payment rail use a category
            label: `Payment Fee`, `Payroll`, `Payroll Reversal`,
            `Subscription Fees`, `Statutory Deposit`, `Payroll Fees`, or
            `Interest`.
          example: Payroll
        momo:
          $ref: "#/components/schemas/momoDetails"
        bank:
          $ref: "#/components/schemas/bankDetails"
        swift:
          $ref: "#/components/schemas/swiftDetails"
        ach:
          $ref: "#/components/schemas/achDetails"
        wallet:
          $ref: "#/components/schemas/walletDetails"
        wire:
          $ref: "#/components/schemas/wireDetails"
  securitySchemes:
