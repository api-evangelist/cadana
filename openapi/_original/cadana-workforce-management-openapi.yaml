        description:
          type: string
          description: description for the deposit
          example: Payroll 10/10
        value:
          $ref: "#/components/schemas/amount"
    CreateBusinessDepositRequest:
      description: Create a deposit to add funds to a business account
      type: object
      required:
        - externalAccountId
        - idempotencyKey
        - amount
        - suppressNotification
        - paymentMethod
      properties:
        amount:
          $ref: "#/components/schemas/amount"
        idempotencyKey:
          type: string
          description: Unique string to prevent dedupe
          example: b6ae5da9-6342-4a58-bd50-8564d68d3f7e
        externalAccountId:
          type: string
          description: unique identifier of the external account to pull funds from, required for an ach direct-debit
          example: 8ef9a712-cdae-4110-b1ea-9ba95abbee6e
        paymentMethod:
          type: string
          enum:
            - ach
          description: Payment method for the deposit
          example: ach
        description:
          type: string
          description: Optional free-text label attached to the deposit. Surfaced on the resulting ledger entry and any notification emails.
          example: April payroll funding
