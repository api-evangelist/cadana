            - kyc-id-back
            - kyc-selfie
            - kyc-id-selfie
            - kyb-incorporation-document
            - kyb-tax-certificate
            - kyb-address-proof
            - kyc-address-proof
            - reimbursements-proof
            - business-onboarding-document
            - contract
            - milestone-document
            - statutory-document
          example: kyc-id-front
        getUrl:
          type: string
          format: uri
          description: Pre-signed HTTPS GET URL (single-use)
        expiresIn:
          type: integer
          description: Seconds until the URL expires
          example: 899
        createdAt:
          type: integer
          description: Unix timestamp when the file was created
          example: 1748478276
        tenantKey:
          type: string
          description: Tenant key associated with the file
          example: cad65668351
    CalculateTaxesRequest:
      type: object
      required:
