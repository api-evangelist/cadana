      properties:
        identity:
          type: object
          description: Identity resubmission details. All fields required when provided.
          required:
            - firstName
            - lastName
            - dob
            - nationality
            - idDetails
          properties:
            firstName:
              type: string
              description: User's first name
              example: John
            lastName:
              type: string
              description: User's last name
              example: Doe
            dob:
              type: string
              format: date
              description: Date of birth in YYYY-MM-DD format
              example: "1990-01-15"
            nationality:
              type: string
              description: User's nationality (2-letter country code)
