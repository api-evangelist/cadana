            type: string
            format: uuid
        - name: userId
          in: query
          required: false
          description: Only include invoices belonging to this user
          schema:
            type: string
            format: uuid
        - name: source
          in: query
          required: false
          description: >-
            Filter by invoice origin, e.g. only contractor-submitted invoices
            (CONTRACTOR_SUBMITTED) or invoices auto-created from payroll
            (PAYROLL)
          schema:
            type: string
            enum:
              - SYSTEM
              - USER
              - REIMBURSEMENT
              - PAYROLL
              - CONTRACTOR_SUBMITTED
        - name: status
          in: query
          required: false
          description: >-
            Filter by invoice status (case-insensitive), e.g. Pending,
            Processing, Paid, Partially Paid, Overdue, Cancelled
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filter by invoice type
          schema:
            type: string
            enum:
              - MANUAL
              - PAYROLL
              - CONTRACTOR
        - name: startDate
          in: query
          required: false
          description: Only include invoices with an invoice date on or after this date
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: Only include invoices with an invoice date on or before this date
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          description: Maximum number of invoices to return per page (default 20)
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque pagination cursor from the previous page's `node.next`.
            Omit to start from the first page.
          schema:
            type: string
      responses:
        "200":
          description: A list of invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        status:
                          type: string
                          description: Invoice status
                        source:
                          type: string
                          enum:
                            - SYSTEM
                            - USER
                            - REIMBURSEMENT
                            - PAYROLL
                            - CONTRACTOR_SUBMITTED
                          description: Origin of the invoice
                        type:
                          type: string
                          enum:
                            - MANUAL
                            - PAYROLL
                            - CONTRACTOR
                          description: Invoice type
                        invoiceNumber:
                          type: string
                          description: Human-readable invoice number
                        from:
                          type: string
                          description: Name of the invoice issuer
                        billTo:
                          type: string
                          description: Name of the billed party
                        personId:
                          type: string
                          format: uuid
                          description: >-
                            The person the invoice is for (e.g. the contractor
                            being paid), when applicable
                        userId:
                          type: string
                          format: uuid
                          description: The user the invoice belongs to, when applicable
                        date:
                          type: string
                          format: date
                          description: Invoice date
                        datePayable:
                          type: string
                          format: date
                          description: Date the invoice is payable
                        subtotalAmount:
                          type: array
                          description: Subtotal per currency
                          items:
                            type: object
                            properties:
                              value:
                                type: string
                                description: Decimal amount as a string
                              currency:
                                type: string
                        totalAmount:
                          type: array
                          description: Total per currency
                          items:
                            type: object
                            properties:
                              value:
                                type: string
                                description: Decimal amount as a string
                              currency:
                                type: string
                  node:
                    type: object
                    description: Pagination cursors
                    properties:
                      previous:
                        type: string
                        nullable: true
                        description: Cursor this page started from; null on the first page
                      next:
                        type: string
                        nullable: true
                        description: Cursor for the next page; null when there are no more results
              example:
                data:
                  - id: "0f6c2f8a-3d9b-4c57-9a41-8f2f6f7f1c33"
                    status: "Pending"
                    source: "PAYROLL"
                    type: "CONTRACTOR"
                    invoiceNumber: "1764332528"
                    from: "Ada Lovelace"
                    billTo: "Globex LLC"
                    personId: "9d2f7a44-1be3-4e28-8d40-63f19a7d5b8e"
                    userId: "b58725e6-fabc-4a1a-9e5f-31efdbdbc45f"
                    date: "2025-11-28"
                    datePayable: "2025-12-28"
                    subtotalAmount:
                      - value: "800.00"
                        currency: "USD"
                    totalAmount:
                      - value: "800.00"
                        currency: "USD"
                  - id: "ca51f42c-0adc-4a77-8dd1-a03dd4fb955f"
                    status: "Paid"
                    source: "SYSTEM"
                    type: "MANUAL"
                    invoiceNumber: "1764332529"
                    from: "Acme Inc"
                    billTo: "Globex LLC"
                    date: "2025-11-28"
                    datePayable: "2025-12-28"
                    subtotalAmount:
                      - value: "800.00"
                        currency: "USD"
                    totalAmount:
                      - value: "880.00"
                        currency: "USD"
                node:
                  next: "eyJ0ZW5hbnRLZXkiOnsiUyI6InRibDI4MTUzMjA4In0sInNvcnRLZXkiOnsiUyI6ImNhNTFmNDJjIn19"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/invoices/{invoiceId}:
    get:
      summary: Get Invoice
      description: Get invoice details
      operationId: getInvoice
      tags:
        - Invoices
      parameters:
        - $ref: "#/components/parameters/invoiceId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/GetInvoiceResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/invoices/{invoiceId}/url:
    get:
      summary: Get Invoice URL
      description: Get a short-lived URL for the invoice PDF
      operationId: getInvoiceUrl
      tags:
        - Invoices
      parameters:
        - $ref: "#/components/parameters/invoiceId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/GetInvoiceUrlResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/invoices/{invoiceId}/review:
    post:
      summary: Review Invoice
      description: >-
        Approve or reject a contractor self-submitted invoice. Only invoices
        with a `source` of `CONTRACTOR_SUBMITTED` in `pending` status can be
        reviewed; any other invoice returns 400.
      operationId: reviewInvoice
      tags:
        - Invoices
      parameters:
        - $ref: "#/components/parameters/invoiceId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - approve
                    - reject
                  description: Whether to approve or reject the invoice
                reason:
                  type: string
                  description: Reason for the decision. Required when action is reject.
      responses:
        "204":
          description: Invoice reviewed
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/invoices/{invoiceId}/cancel:
    post:
      summary: Cancel Invoice
      description: >-
        Cancel an invoice. The invoice is voided and can no longer be paid or
        reviewed.
      operationId: cancelInvoice
      tags:
        - Invoices
      parameters:
        - $ref: "#/components/parameters/invoiceId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "204":
          description: Invoice cancelled
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/reimbursements:
    get:
      summary: List Reimbursements
      description: List reimbursements for your business.
      operationId: listReimbursements
      tags:
        - Reimbursements
      parameters:
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          description: A list of reimbursements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        userId:
                          type: string
                          format: uuid
                        title:
                          type: string
                        fullName:
                          type: string
                        currency:
                          type: string
                        destinationCurrency:
                          type: string
                        status:
                          type: string
                        totalAmount:
                          type: object
                          properties:
                            currency:
                              type: string
                            value:
                              type: string
                        createdTimestamp:
                          type: integer
                        lastUpdatedTimestamp:
                          type: integer
                  node:
                    type: object
              example:
                data:
                  - id: "d1e2f3a4-5678-9012-cdef-345678901234"
                    userId: "a3b4c5d6-e7f8-9012-abcd-ef3456789012"
                    title: "Client dinner"
                    fullName: "Ada Lovelace"
                    currency: "USD"
                    destinationCurrency: "USD"
                    status: "Approved"
                    totalAmount:
                      currency: "USD"
                      value: "1000.00"
                    createdTimestamp: 1764332528
                    lastUpdatedTimestamp: 1764332600
                node: {}
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
    post:
      summary: Create Reimbursement
      description: >-
        Create a reimbursement for a worker in your business. The reimbursement
        is created in a pending status and must be reviewed (via [`POST
        /v1/reimbursements/{reimbursementId}/review`](#tag/reimbursements/post/v1/reimbursements/{reimbursementId}/review))
        before it is paid out. Each entry may optionally reference one or more
        `fileIds` of previously uploaded files to attach proof (e.g. receipts).
      operationId: createReimbursement
      tags:
        - Reimbursements
      parameters:
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReimbursementRequest"
      responses:
        "200":
          description: The created reimbursement's id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
              example:
                id: "d1e2f3a4-5678-9012-cdef-345678901234"
        "400":
          $ref: "#/components/responses/BadRequestError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/reimbursements/{reimbursementId}:
    get:
      summary: Get Reimbursement
      description: Get a reimbursement's details.
      operationId: getReimbursement
      tags:
        - Reimbursements
      parameters:
        - $ref: "#/components/parameters/reimbursementId"
        - $ref: "#/components/parameters/XMultiTenantKey"
        - name: potentialSourceCurrency
          in: query
          required: false
          description: >-
            Return a `potentialSourceAmount` quote — the estimated amount that
            would be debited from a wallet of this currency to fund the
            reimbursement, at current FX rates. Only computed while the
            reimbursement is not yet approved or paid.
          schema:
            type: string
      responses:
        "200":
          description: The reimbursement
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  title:
                    type: string
                  fullName:
                    type: string
                  currency:
                    type: string
                  destinationCurrency:
                    type: string
                  status:
                    type: string
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        description:
                          type: string
                        amount:
                          type: object
                          properties:
                            currency:
                              type: string
                            value:
                              type: string
                        category:
                          type: string
                        date:
                          type: string
                  sourceAmount:
                    type: object
                    properties:
                      currency:
                        type: string
                      value:
                        type: string
                  destinationAmount:
                    type: object
                    properties:
                      currency:
                        type: string
                      value:
                        type: string
                  potentialSourceAmount:
                    type: object
                    description: >-
                      Estimated amount that would be debited from a
                      `potentialSourceCurrency` wallet to fund this
                      reimbursement, at current FX rates. Only returned when the
                      `potentialSourceCurrency` query parameter is supplied and
                      the reimbursement is not yet approved or paid.
                    properties:
                      currency:
                        type: string
                      value:
                        type: string
                  fxRate:
                    type: object
                    description: >-
                      Conversion rates applied when the source and destination
                      currencies differ, keyed by `FROM-TO` currency pair.
                      Absent when no conversion was needed.
                    additionalProperties:
                      type: string
                  createdTimestamp:
                    type: integer
                  lastUpdatedTimestamp:
                    type: integer
              example:
                id: "d1e2f3a4-5678-9012-cdef-345678901234"
                userId: "a3b4c5d6-e7f8-9012-abcd-ef3456789012"
                title: "Client dinner"
                fullName: "Ada Lovelace"
                currency: "USD"
                destinationCurrency: "USD"
                status: "Approved"
                entries:
                  - id: "e1f2a3b4-5678-9012-cdef-345678901234"
                    description: "Dinner with client"
                    amount:
                      currency: "USD"
                      value: "1000.00"
                    category: "Meals"
                    date: "2025-11-28"
                sourceAmount:
                  currency: "GHS"
                  value: "15420.00"
                destinationAmount:
                  currency: "USD"
                  value: "1000.00"
                fxRate:
                  USD-GHS: "15.42"
                createdTimestamp: 1764332528
                lastUpdatedTimestamp: 1764332600
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
    delete:
      summary: Cancel Reimbursement
      description: >-
        Cancel a reimbursement. Only reimbursements that are not already
        approved or paid can be cancelled.
      operationId: cancelReimbursement
      tags:
        - Reimbursements
      parameters:
        - $ref: "#/components/parameters/reimbursementId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "204":
          description: Reimbursement cancelled
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/reimbursements/{reimbursementId}/review:
    post:
      summary: Review (Approve or Reject) Reimbursement
      description: >-
        Approve or reject a reimbursement. **Approving pays it out** — the
        reimbursement amount is disbursed immediately from the `sourceCurrency`
        wallet (subject to a balance check), and a `reimbursement.paid` webhook
        follows once the disbursement settles. Rejecting requires a `reason`.
        Only reimbursements in a pending status can be reviewed; any other
        reimbursement returns 400.
      operationId: reviewReimbursement
      tags:
        - Reimbursements
      parameters:
        - $ref: "#/components/parameters/reimbursementId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - approve
                    - reject
                  description: Whether to approve or reject the reimbursement
                sourceCurrency:
                  type: string
                  description: >-
                    The wallet currency to disburse the reimbursement from; its
                    balance must cover the amount. Required when action is
                    approve (approving disburses the funds).
                reason:
                  type: string
                  description: Reason for the decision. Required when action is reject.
      responses:
        "204":
          description: Reimbursement reviewed
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
components:
  schemas:
    uuid:
      type: string
      format: uuid
      example: 8ef9a712-cdae-4110-b1ea-9ba95abbee6e
    CreateReimbursementRequest:
      description: >-
        Create reimbursement request payload. Identify the worker with exactly
        one of `userId` or `personId`.
      type: object
      required:
        - title
        - currency
        - destinationCurrency
        - entries
      properties:
        userId:
          type: string
          format: uuid
          description: >-
            The worker the reimbursement is for. Provide either `userId` or
            `personId`.
          example: a3b4c5d6-e7f8-9012-abcd-ef3456789012
        personId:
          type: string
          format: uuid
          description: >-
            The worker the reimbursement is for, identified by their personId
            within the tenant. Provide either `userId` or `personId`.
          example: c5d6e7f8-9012-3456-cdef-789012345678
        title:
          type: string
          description: A short title describing the reimbursement.
          example: Client dinner
        currency:
          type: string
          description: The currency the entry amounts are denominated in.
          example: USD
        destinationCurrency:
          type: string
          description: The currency the worker is reimbursed in.
          example: USD
        entries:
          type: array
          description: The individual line items that make up the reimbursement.
          items:
            $ref: "#/components/schemas/ReimbursementEntryRequest"
    ReimbursementEntryRequest:
      description: A single reimbursement line item
      type: object
      required:
        - description
        - amount
      properties:
        description:
          type: string
          example: Dinner with client
        amount:
          type: object
          properties:
            currency:
              type: string
              example: USD
            value:
              type: string
              example: "1000.00"
        category:
          type: string
          example: Meals
        date:
          type: string
          description: The date the expense was incurred (YYYY-MM-DD).
          example: "2025-11-28"
        fileIds:
          type: array
          description: >-
            IDs of previously uploaded files to attach as proof for this entry
            (e.g. receipts). Optional.
          items:
            type: string
          example:
            - f1e2d3c4-5678-9012-cdef-345678901234
    ExternalAccount:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the external account
          example: d43eaff3-bc75-44f6-ac37-3a305192ead6
        last4:
          type: string
          description: Last 4 digits of the account number
          example: "0000"
        bankName:
          type: string
          description: Name of the bank
          example: Example Bank
        status:
          type: string
          description: Status of the external account
          example: ACTIVE
        hostedVerificationUrl:
          type: string
          description: URL for hosted verification if required
        provider:
          type: string
          description: Provider of the external account link
          example: PLAID
    tags:
      type: object
      description: Any custom data you want to store
    amount:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          description: value in lowest denomination
          example: 10000
        currency:
          type: string
          description: currency
          example: USD
    allowance:
      type: object
      required:
        - name
        - isTaxable
        - amount
      properties:
        name:
          type: string
          example: Housing
        isTaxable:
          type: boolean
          description: Whether this allowance is included in taxable income.
          example: true
        amount:
          $ref: "#/components/schemas/amount"
    deduction:
      type: object
      required:
        - name
        - isStatutory
        - amount
      properties:
        name:
          type: string
          example: Income Tax
        isStatutory:
          type: boolean
          description: Whether this deduction is mandated by law (e.g., income tax, social security) versus a non-statutory item.
          example: true
        amount:
          $ref: "#/components/schemas/amount"
    nodePagination:
      type: object
      description: Node pagination
      properties:
        next:
          type: string
        previous:
          type: string
    basicInfo:
      type: object
      required:
        - email
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          description: Person's first name
          example: John
        lastName:
          type: string
          description: Person's last name
          example: Doe
        email:
          type: string
          description: Person's email
        phoneNumber:
          $ref: "#/components/schemas/phoneNumber"
        metadata:
          type: object
          additionalProperties: true
          description: Optional metadata you can store as key-value pairs
          example:
            customField1: value1
            customField2: value2
    phoneNumber:
      type: object
      description: Person's phone number
      properties:
        countryCode:
          type: string
          example: "1"
        number:
          type: string
          example: "2345678901"
    address:
      type: object
      description: Address
      required:
        - countryCode
      properties:
        line1:
          type: string
          example: Street 1
        line2:
          type: string
          example: Apt 1
        city:
          type: string
          example: Gotham
        postalCode:
          type: string
          example: "10001"
        state:
          type: string
          example: NY
        countryCode:
          type: string
          example: US
    compInfo:
      type: object
      description: Person's compensation information, how much will they get paid, currency and frequency
      properties:
        type:
          type: string
          description: Person's compensation type
          example: net
          enum:
            - net
            - salaried
            - milestone
        salary:
          type: object
          description: Person's compensation amount
          allOf:
            - $ref: "#/components/schemas/amount"
        frequency:
          type: string
          description: Person's compensation frequency
          example: monthly
          enum:
            - hourly
            - daily
            - monthly
        employmentModel:
          type: string
          description: Specifies the employment model for the person. Set to "eor" for Employer of Record employees. When omitted, the person is treated as direct employment.
          example: eor
          enum:
            - eor
    UpdatePersonTypeRequest:
      type: object
      required:
        - newType
      properties:
        newType:
          type: string
          description: The new employment type for the person
          enum:
            - EMPLOYEE
            - CONTRACTOR
          example: CONTRACTOR
        compInfo:
          description: Optional compensation for the new type. If omitted, incompatible compensation is auto-converted (salaried becomes net, fixed becomes net).
          allOf:
            - $ref: "#/components/schemas/compInfo"
    ScheduleOffboardingRequest:
      type: object
      required:
        - exitDate
        - reason
      properties:
        exitDate:
          type: string
          format: date
          description: The date the person will exit the organization
          example: "2025-06-30"
        reason:
          type: string
          description: The reason for offboarding
          example: Voluntary resignation
        compensation:
          $ref: "#/components/schemas/compInfo"
        includeInRegularPayroll:
          type: boolean
          description: Whether to include the person in the regular payroll run for their exit period
          example: true
    OffboardingDetails:
      type: object
      properties:
        exitDate:
          type: string
          format: date
          example: "2025-06-30"
        reason:
          type: string
          example: Voluntary resignation
        compensation:
          $ref: "#/components/schemas/compInfo"
        includeInRegularPayroll:
          type: boolean
          example: true
    jobInfo:
      type: object
      description: Person's job information, start date, job title, and employee number
      properties:
        startDate:
          type: string
          format: date
          example: "2023-01-01"
        employeeNumber:
          type: string
          example: "1"
        title:
          type: string
          example: Software Engineer
        department:
          type: string
          example: Product
        customFields:
          type: array
          description: A list of custom fields associated with the job information
          items:
            $ref: "#/components/schemas/customField"
        entityId:
          type: string
          format: uuid
