  /v1/businesses/{businessId}/kyb:
    post:
      summary: Submit KYB
      description: >-
        Submit Know Your Business (KYB) information for verification. Use POST to provide new
        information — the initial submission and any change to the set of principals; to
        correct information already on file, use PATCH instead.
      operationId: submitKYB
      tags:
        - KYB
      parameters:
        - $ref: "#/components/parameters/businessId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KYBRequest"
      responses:
        "204":
          description: KYB information submitted successfully
        "400":
          description:
            Bad input, or the KYB is not editable. Submission is only allowed while the KYB
            status is `initialized`, `incomplete`, `awaiting-principal-kyc`, or
            `needs-additional-info` — a KYB that is `pending-review`, `complete`, or
            `rejected` cannot be modified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
    get:
      summary: Get KYB
      description: Returns the business's KYB details. Returns 404 if KYB has not been started for the business.
      operationId: getKyb
      tags:
        - KYB
      parameters:
        - $ref: "#/components/parameters/businessId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/GetKYBResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
    patch:
      summary: Update KYB
      description: >-
        Update KYB information already provided. Only the fields you include are changed;
        new principals cannot be added with PATCH — re-POST the full submission instead.
        Document arrays are appended to, not replaced.
      operationId: updateKyb
      tags:
        - KYB
      parameters:
        - $ref: "#/components/parameters/businessId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/KYBRequest"
                - type: object
                  properties:
                    principals:
                      type: array
                      description:
                        Principals to update. Each entry — including individuals nested under an
                        entity principal's 'entity.individuals' — must include the 'id' of an
                        existing principal (returned by GET KYB); a missing or unknown 'id' fails
                        the request with 400. PATCH cannot add new principals — re-POST the full
                        submission to add one.
                      items:
                        allOf:
                          - $ref: "#/components/schemas/PrincipalRequest"
                          - type: object
                            required:
                              - id
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: ID of the existing principal being updated (required at every nesting level in PATCH requests)
                                example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "204":
          description: KYB information updated successfully
        "400":
          description:
            Bad input, an unknown principal `id` (`"principal not found"`), or the KYB is not
            editable. Updates are only allowed while the KYB status is `initialized`,
            `incomplete`, `awaiting-principal-kyc`, or `needs-additional-info` — a KYB that is
            `pending-review`, `complete`, or `rejected` cannot be modified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/businesses/{businessId}/kyb-link:
    post:
      summary: Generate KYB Link
      description: Get KYB Link
      operationId: getKybLink
      tags:
        - KYB
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateKybLinkRequest"
      parameters:
        - $ref: "#/components/parameters/businessId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
