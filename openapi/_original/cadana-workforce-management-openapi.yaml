openapi: 3.0.0
info:
  description: APIs for interacting with Cadana Payroll Platform
  version: 1.0.0
  title: Business Workforce Management
  termsOfService: https://cadanapay.com/terms-and-conditions
  contact:
    email: api@cadanapay.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://api.cadanapay.com
    description: Prod Server
  - url: https://dev-api.cadanapay.com
    description: Dev Server
security:
  - Authorization: []
tags:
  - name: Custom Auth
    description: APIs for interacting with Custom Authentication
  - name: Persons
    description: APIs for interacting with the HR module
  - name: Milestones
    description: APIs for milestone-based contractor pay
  - name: Instant Pay
    description: APIs for interacting with Instant Pay functionality
  - name: Users
    description: APIs for interacting with employee/contractor Cadana accounts
  - name: Files
    description: APIs for interacting with file uploads
  - name: Payrolls
    description: APIs for interacting with Payroll
  - name: Platform
    description: Platform APIs for interacting with businesses
  - name: Businesses
    description: APIs for interacting with Business
  - name: Treasury
    description: APIs for business balances, funding, and withdrawals
  - name: KYB
    description: APIs for business verification
  - name: Contracts
    description: APIs for interacting with contracts
  - name: Sandbox
    description: APIs for relevant sandbox simulations
  - name: Invoices
    description: APIs for interacting with invoices
  - name: Reimbursements
    description: APIs for interacting with reimbursements
  - name: Entities
    description: APIs for managing legal sub-entities (subsidiaries, branches) under a parent business
paths:
  /v1/persons/{personId}:
    get:
      summary: Get
      description: Fetch a person's details
      operationId: getPerson
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/GetPersonResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons:
    get:
      summary: List
      description: Get all persons
      operationId: getPersons
      tags:
        - Persons
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number to retrieve
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Maximum number of items to return per page
        - in: query
          name: email
          schema:
            type: string
          description: Filter by email
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/GetPersonsResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
    post:
      summary: Create
      description: Create a new employee/contractor
      operationId: createPerson
      tags:
        - Persons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonRequest"
      responses:
        "200":
          $ref: "#/components/responses/CreatePersonResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
      parameters:
        - $ref: "#/components/parameters/XMultiTenantKey"
  /v1/persons/{personId}/basicInfo:
    put:
      summary: Update basic information
      description: Update a person's basic information
      operationId: updatePersonBasicInfo
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonBasicInfoRequest"
      responses:
        "204":
          description: Successful operation
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/personalInfo:
    put:
      summary: Update personal information
      description: Update a person's personal information including identity documents, date of birth, gender, nationality, and address
      operationId: updatePersonPersonalInfo
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonPersonalInfoRequest"
      responses:
        "204":
          description: Successful operation
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/taxProfile:
    get:
      summary: Get tax profile
      description: Retrieve a person's tax profile. Returns the shape accepted by PUT /v1/persons/{personId}/taxProfile plus a server-derived `countryCode` field — remove `countryCode` before resubmitting via PUT.
      operationId: getPersonTaxProfile
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPersonTaxProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
    put:
      summary: Update tax profile
      description: Update a person's tax profile with country-specific tax fields such as marital status and number of dependents
      operationId: updatePersonTaxProfile
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonTaxProfileRequest"
      responses:
        "204":
          description: Successful operation
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/jobInfo:
    put:
      summary: Update job information
      description: Update a person's job information
      operationId: updatePersonJobInfo
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonJobInfoRequest"
      responses:
        "204":
          description: Successful operation
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/paymentInfo:
    get:
      summary: Get payment information
      description: Fetch a person's payment information
      operationId: getPersonPaymentInfo
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/GetPersonPaymentInfoResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
    put:
      summary: Update payment information
      description: >-
        Update a person's payment information. Required fields vary by payout
        corridor — use [GET /v1/payment-requirements](/api-reference/payments/resources/payment-corridor-requirements)
        as the authoritative list of fields for each currency and method.
      operationId: updatePersonPaymentInfo
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonPaymentInfoRequest"
            examples:
              achPayment:
                $ref: "#/components/examples/achPaymentMethod"
              swiftPayment:
                $ref: "#/components/examples/swiftPaymentMethod"
              philippinesBankPayment:
                $ref: "#/components/examples/philippinesBankPaymentMethod"
              indiaBankPayment:
                $ref: "#/components/examples/indiaBankPaymentMethod"
              mexicoBankPayment:
                $ref: "#/components/examples/mexicoBankPaymentMethod"
              colombiaBankPayment:
                $ref: "#/components/examples/colombiaBankPaymentMethod"
              elSalvadorBankPayment:
                $ref: "#/components/examples/elSalvadorBankPaymentMethod"
              walletRequest:
                $ref: "#/components/examples/walletPaymentMethod"
      responses:
        "204":
          description: Successful operation
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/ipSetting:
    put:
      summary: Update instant pay setting
      description: Update a person's instant pay setting
      operationId: updatePersonIPSetting
      tags:
        - Instant Pay
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonIPSettingRequest"
      responses:
        "204":
          description: Successful operation
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
    get:
      summary: Get instant pay setting
      description: Fetch a person's instant pay setting
      operationId: getPersonIPSetting
      tags:
        - Instant Pay
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/GetPersonIPSettingResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/instantPays:
    get:
      summary: Get instant pay transactions
      description: Fetch a person's instant pay transactions
      operationId: getPersonIPTransactions
      tags:
        - Instant Pay
      parameters:
        - $ref: "#/components/parameters/personId"
        - in: query
          name: isUnpaid
          schema:
            type: boolean
          description: Only return transactions that have not been paid back
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/GetPersonInstantPaysResponse"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/offboard:
    post:
      summary: Schedule offboarding
      description: Schedule a person for offboarding on a given exit date
      operationId: scheduleOffboarding
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleOffboardingRequest"
      responses:
        "204":
          description: Offboarding scheduled successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/cancelOffboarding:
    post:
      summary: Cancel offboarding
      description: Cancel a pending offboarding and return the person to active status
      operationId: cancelOffboarding
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "204":
          description: Offboarding cancelled successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/reinstate:
    post:
      summary: Reinstate
      description: Reinstate a former person back to active status
      operationId: reinstatePerson
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "204":
          description: Person reinstated successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/type:
    put:
      summary: Update person type
      description: Switch a person's employment type between employee and contractor. The person must be in Active status. Optionally provide new compensation info. If omitted, incompatible compensation is auto-converted (salaried becomes net, fixed becomes net).
      operationId: updatePersonType
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonTypeRequest"
      responses:
        "204":
          description: Person type updated successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/milestones:
    get:
      summary: List milestones
      description: List a milestone-type contractor's milestones. Set `includeDocuments=true` to receive presigned document download URLs.
      operationId: getPersonMilestones
      tags:
        - Milestones
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
        - name: includeDocuments
          in: query
          required: false
          description: When true, each milestone's documents are returned as presigned download URLs
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: "#/components/responses/GetMilestonesResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
    post:
      summary: Add milestone
      description: Add a milestone (deliverable) to a milestone-type contractor. `documentIds` are file ids from the upload-url flow (POST /v1/files/upload-url with purpose `milestone-document`).
      operationId: addPersonMilestone
      tags:
        - Milestones
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMilestoneRequest"
      responses:
        "200":
          $ref: "#/components/responses/CreateMilestoneResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/milestones/{milestoneId}:
    put:
      summary: Update milestone
      description: Update a planned milestone. `documentIds` are file ids from the upload-url flow and replace the milestone's documents.
      operationId: updatePersonMilestone
      tags:
        - Milestones
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/milestoneId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMilestoneRequest"
      responses:
        "204":
          description: Milestone updated successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
    delete:
      summary: Delete milestone
      description: Delete a planned milestone.
      operationId: deletePersonMilestone
      tags:
        - Milestones
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/milestoneId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "204":
          description: Milestone deleted successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/persons/{personId}/milestones/{milestoneId}/complete:
    post:
      summary: Complete milestone
      description: Mark a planned or rejected milestone complete. Generates a contractor invoice and returns its `invoiceId`, and moves the milestone to `Submitted`. As that invoice is approved, rejected, or paid, the milestone status updates to match.
      operationId: completePersonMilestone
      tags:
        - Milestones
      parameters:
        - $ref: "#/components/parameters/personId"
        - $ref: "#/components/parameters/milestoneId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/CreateMilestoneResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/auth/login/jwt:
    post:
      summary: JWT
      description: Exchange your internal JWT to a cadana redirect token
      operationId: exchangeJwtToken
      tags:
        - Custom Auth
      parameters:
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeJWTRequest"
      responses:
        "200":
          $ref: "#/components/responses/ExchangeJWTResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/users/{userId}/sub:
    put:
      summary: Attach a custom sub
      description: Append your external token subject to cadana user
      operationId: updateUserSubject
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserSubjectRequest"
      responses:
        "204":
          description: The user subject was attached, now you can log in with your external JWT
        "400":
          $ref: "#/components/responses/BadRequestError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/users/admins:
    post:
      summary: Add Admin
      description: Add an admin to the business account
      operationId: addAdminUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdminUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/AddAdminUserResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
      parameters:
        - $ref: "#/components/parameters/XMultiTenantKey"
  /v1/users/admins/{userId}:
    delete:
      summary: Remove Admin
      description: Remove an admin from the business account
      operationId: removeAdminUser
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "204":
          description: Successful operation
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/users/invite:
    post:
      summary: Invite
      description: Create a user for the associated person record
      operationId: inviteUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/InviteUserResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
      parameters:
        - $ref: "#/components/parameters/XMultiTenantKey"
  /v1/users:
    get:
      summary: List
      description: Get all users
      operationId: getUsers
      tags:
        - Users
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number to retrieve
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Maximum number of items to return per page
        - in: query
          name: personId
          schema:
            type: string
          description: Filter by person ID
        - in: query
          name: email
          schema:
            type: string
          description: Filter by email
        - in: query
          name: includeStatus
          schema:
            type: string
          description: Toggle including user status in the response
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/GetUsersResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/users/{userId}:
    get:
      summary: Get
      description: Fetch a user's details
      operationId: getUser
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/GetUserResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
  /v1/users/{userId}/kyc:
    get:
      summary: Get KYC
      description: Fetch a user's kyc details
      operationId: getUserKYC
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          $ref: "#/components/responses/GetUserKYCResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        5XX:
          $ref: "#/components/responses/InternalError"
      security:
        - Authorization: []
    post:
      summary: Submit KYC
      description: Submit Know Your Customer (KYC) information for verification
      operationId: submitUserKYC
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/XMultiTenantKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KYCRequest"
            examples:
              userKycSubmission:
                summary: User KYC submission example
                value:
                  firstName: John
                  lastName: Doe
                  dob: "1990-01-15"
                  nationality: US
                  address:
                    line1: 123 Main Street
                    line2: Apt 101
                    city: Anytown
                    postalCode: "12345"
                    state: NY
                    countryCode: US
                  idDetails:
                    type: passport
                    number: "123456789"
                    issuedCountryCode: US
                    issuedBy: Department of State
                    issuedDate: "2020-01-15"
                    expirationDate: "2030-01-15"
