  /v1/payrolls/{payrollId}/save:
    post:
      summary: Save
      description: Save a payroll
      operationId: savePayroll
      tags:
        - Payrolls
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePayroll"
            example:
              payrollDate: "2026-03-01"
              payPeriod:
                fromDate: "2026-02-01"
                toDate: "2026-02-28"
              entries:
                - personId: 8ab2ba37-3c37-485d-9af9-122d11c96bf9
                  salary:
                    amount: 500000
                    currency: USD
                - personId: ca49c55b-12c7-4085-8a0d-ebd006ed8002
                  salary:
                    amount: 375000
                    currency: USD
      parameters:
        - $ref: "#/components/parameters/payrollId"
        - in: query
          name: includeFxRates
          required: false
          schema:
            type: boolean
            default: false
          description: >
            When `true`, the response is `200 OK` with the captured FX rates
            in the body, keyed as `<funding>-<salary>` currency pairs. Any
            other value (or omitting the parameter) returns `204 No Content`.
        - $ref: "#/components/parameters/XMultiTenantKey"
      responses:
        "200":
          description: >
            FX rates captured at save time. Returned only when
            `includeFxRates=true`. Keys are `<funding>-<salary>` currency
            pairs; each value is the number of salary-currency units per unit
            of funding currency. Salary-currency amounts are divided by the
            rate to get the funding-currency debit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fxRates:
                    type: object
                    description: >
                      Map of `<funding>-<salary>` currency pair to the captured rate.
                    additionalProperties:
                      type: number
                example:
                  fxRates:
                    USD-PHP: 58.75
                    USD-EUR: 0.9217
        "204":
          description: Successful operation. Default response when `includeFxRates` is omitted or not `true`.
        "400":
          $ref: "#/components/responses/BadRequestError"
      security:
        - Authorization: []
