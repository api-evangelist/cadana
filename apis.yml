aid: cadana
name: Cadana
description: >-
  Cadana is a white-label global payment and payroll infrastructure provider for talent
  platforms, staffing companies, and HR providers. Its APIs let partners onboard and pay
  employees and contractors in 100+ countries, run multi-currency payroll, provision embedded
  wallets and virtual accounts, calculate gross-to-net tax across 150+ jurisdictions, and
  automate statutory filing and government remittance. The platform is delivered as five REST
  APIs (Workforce Management, Embedded Payments, Embedded Consumer Wallets, Global Tax Engine,
  and Statutory Compliance) with bearer-token auth, Svix-signed webhooks, a sandbox, and an
  embeddable white-label UI and salary-calculator widget. Backed by 500 Global.
accessModel:
  pricing: unknown
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Self-serve signup
